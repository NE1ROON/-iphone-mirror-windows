[package]
name = "iphone-mirror-windows"
version = "1.0.0"
edition = "2021"
description = "iPhone Mirror wrapper for Windows (Bezel/Reflector) — frameless, always-on-top, draggable"
authors = ["You"]
license = "MIT"
repository = "https://github.com/yourname/iphone-mirror-windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
    "tray-icon",
    "global-shortcut",
    "process",
    "shell",
    "fs",
    "dialog",
    "notification",
    "updater",
    "macos-private-api",
] }
tauri-plugin-store = "2"
tauri-plugin-autostart = { version = "2", features = ["macos-launch-agent"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
] }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"